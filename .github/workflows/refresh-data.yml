name: Deploy and refresh GIS
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '17 */12 * * *'

# Serializes releases and refreshes; a failed refresh never uploads an artifact.
concurrency:
  group: ghush-pages-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: read
    outputs:
      deploy: ${{ steps.config.outputs.deploy }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - name: Decide whether to refresh
        id: config
        env:
          SOURCE: ${{ vars.GHUSH_SOURCE }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          case "$SOURCE" in
            ""|api|csv) ;;
            *) echo "::error::GHUSH_SOURCE must be api or csv for unattended updates"; exit 1 ;;
          esac
          if [ "$EVENT" = schedule ] && [ -z "$SOURCE" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "refresh=false" >> "$GITHUB_OUTPUT"
            echo "Automatic refresh is disabled: configure an approved source first." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            if [ "$EVENT" != push ] && [ -n "$SOURCE" ]; then
              echo "refresh=true" >> "$GITHUB_OUTPUT"
            else
              echo "refresh=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.config.outputs.deploy == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.config.outputs.deploy == 'true'
        with:
          node-version: '22'
      - name: Install tested dependency lock
        if: steps.config.outputs.deploy == 'true'
        run: python -m pip install -r requirements-dev.txt
      - name: Test pipeline, contracts and frontend
        if: steps.config.outputs.deploy == 'true'
        run: |
          python -m compileall -q pipeline
          python -m pytest -q
          node --check site/app.js
          node --check site/core.js
          node --check site/analytics.js
          node --test tests/frontend.test.js
      - name: Cache validated boundaries
        if: steps.config.outputs.refresh == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/boundaries
          key: bgd-hierarchy-v3-${{ hashFiles('pipeline/fetch_boundaries.py', 'pipeline/geography.py', 'config/district_divisions.json') }}
      - name: Refresh approved source
        if: steps.config.outputs.refresh == 'true'
        env:
          GHUSH_SOURCE: ${{ vars.GHUSH_SOURCE }}
          GHUSH_AUTOMATION_APPROVED: ${{ vars.GHUSH_AUTOMATION_APPROVED }}
          GHUSH_API_URL: ${{ secrets.GHUSH_API_URL }}
          GHUSH_CSV_URL: ${{ secrets.GHUSH_CSV_URL }}
          GHUSH_API_TOKEN: ${{ secrets.GHUSH_API_TOKEN }}
          GHUSH_PUBLIC_LOGS: ${{ github.event.repository.private && 'false' || 'true' }}
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        shell: bash
        run: |
          set -euo pipefail
          python -m pipeline.run --source "$GHUSH_SOURCE"
      - name: Validate the exact public artifact
        if: steps.config.outputs.deploy == 'true'
        run: python -m pipeline.contracts site/data
      - name: Commit only changed public products
        if: steps.config.outputs.refresh == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- site/data/adm3_metrics.geojson site/data/district_metrics.geojson site/data/summary.json site/data/division_summary.json site/data/weekly_summary.json site/data/weekly_summary.csv
          if git diff --cached --quiet; then
            echo "No public data changes; no commit or push." >> "$GITHUB_STEP_SUMMARY"
          else
            git config user.name "ghush-spatial-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: refresh validated public aggregates"
            # No force, no rebase over a competing data release. Failure stops deploy.
            git push origin "HEAD:$DEFAULT_BRANCH"
            echo "Committed changed public aggregates." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Include truthful freshness status
        if: steps.config.outputs.deploy == 'true'
        run: python -m pipeline.status
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: steps.config.outputs.deploy == 'true'
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: steps.config.outputs.deploy == 'true'
        with:
          path: site
          retention-days: 1
      - name: Failure summary
        if: failure()
        run: echo "Validation or refresh failed. No new map was deployed; the last successful Pages deployment remains available." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Deploy in this run: GITHUB_TOKEN commits do not trigger another push workflow.
      - name: Deploy complete validated site
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
