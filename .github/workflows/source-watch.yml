name: Watch for allowed Ghush export

on:
  workflow_dispatch:
  schedule:
    - cron: '43 7 * * *'

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install tested dependencies
        run: python -m pip install -r requirements.txt
      - name: Inspect allowed public surface only
        shell: bash
        run: |
          set -euo pipefail
          python -m pipeline.sources.public_watch | tee source-watch.txt
          {
            echo '## Ghush public source watch'
            echo
            echo 'This job inspects only robots-allowed public HTML/scripts and does not request candidate export/API payloads.'
            echo
            echo '```json'
            cat source-watch.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
